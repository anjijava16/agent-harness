# docker compose up                      -> app + Postgres + Redis on http://localhost:8000
# docker compose --profile mysql up      -> also starts MySQL; set DATABASE_URL to the mysql line below
services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/agent_app
      # DATABASE_URL: mysql+pymysql://app:app@mysql:3306/agent_app
      REDIS_URL: redis://redis:6379/0
      DEFAULT_FRAMEWORK: ${DEFAULT_FRAMEWORK:-deepagents}
      DEFAULT_MODE: ${DEFAULT_MODE:-scripted}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: agent_app}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U app"], interval: 3s, retries: 20}

  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment: {MYSQL_DATABASE: agent_app, MYSQL_USER: app, MYSQL_PASSWORD: app, MYSQL_ROOT_PASSWORD: root}
    ports: ["3306:3306"]
    volumes: [mysqldata:/var/lib/mysql]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 3s, retries: 30}

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}

volumes:
  pgdata:
  mysqldata:
